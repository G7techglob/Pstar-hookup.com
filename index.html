<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaHub</title>

<link rel="stylesheet" href="index.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <img src="logo.png" alt="Logo">
    <span>MediaHub</span>
  </div>

  <div class="menu-btn" id="menuBtn">
    ☰
  </div>
</header>

<!-- NAVIGATION -->
<nav class="navbar" id="navbar">
  <a href="#videos">Videos</a>
  <a href="#photos">Photos</a>
  <a href="#trending">Trending</a>
  <a href="#contact">Contact</a>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Welcome to MediaHub</h1>
  <p>Watch videos and explore photo collections</p>
</section>

<!-- VIDEOS SECTION -->
<section id="videos" class="section">
  <h2>Latest Videos</h2>

  <div class="grid">
    <div class="card">
      <video controls>
        <source src="video1.mp4" type="video/mp4">
      </video>
      <p>Sample Video 1</p>
    </div>

    <div class="card">
      <video controls>
        <source src="video2.mp4" type="video/mp4">
      </video>
      <p>Sample Video 2</p>
    </div>

    <div class="card">
      <video controls>
        <source src="video3.mp4" type="video/mp4">
      </video>
      <p>Sample Video 3</p>
    </div>
  </div>
</section>

<!-- PHOTOS SECTION -->
<section id="photos" class="section">
  <h2>Photo Gallery</h2>

  <div class="grid">
    <div class="card">
      <img src="photo1.jpg" alt="Photo">
    </div>

    <div class="card">
      <img src="photo2.jpg" alt="Photo">
    </div>

    <div class="card">
      <img src="photo3.jpg" alt="Photo">
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2026 MediaHub. All rights reserved.</p>

  <div class="links">
    <a href="#">YouTube</a>
    <a href="#">Instagram</a>
    <a href="#">Facebook</a>
  </div>
</footer>

<script src="index.js"></script>
</body>
</html>
